<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defense Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #2c3e50;
      --accent-color: #e74c3c;
      --light-bg: #f8f9fa;
      --dark-bg: #343a40;
      --text-light: #f8f9fa;
      --text-dark: #212529;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      line-height: 1.6;
      color: var(--text-dark);
      background-color: var(--light-bg);
      margin: 0;
      padding: 0;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }
    
    .logo {
      display: flex;
      align-items: center;
    }
    
    .logo img {
      height: 60px;
      margin-right: 15px;
    }
    
    .logo-text h1 {
      margin: 0;
      color: var(--secondary-color);
      font-size: 28px;
    }
    
    .logo-text p {
      margin: 5px 0 0;
      color: #666;
      font-size: 14px;
    }
    
    /* Defense Matrix Visualization */
    .matrix-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    
    .matrix-category {
      flex: 1;
      min-width: 300px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .category-header {
      background-color: var(--secondary-color);
      color: white;
      padding: 15px 20px;
      font-weight: 500;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .category-header:hover {
      background-color: #1a252f;
    }
    
    .category-header .toggle {
      font-size: 14px;
    }
    
    .category-content {
      padding: 15px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    
    .category-content.show {
      max-height: 1000px;
    }
    
    .matrix-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      position: relative;
      padding-left: 20px;
    }
    
    .matrix-item:before {
      content: "•";
      position: absolute;
      left: 5px;
      color: var(--primary-color);
    }
    
    .matrix-item:hover {
      color: var(--primary-color);
    }
    
    .matrix-item.has-children:after {
      content: "+";
      position: absolute;
      right: 10px;
      color: #999;
    }
    
    .matrix-item.has-children.expanded:after {
      content: "-";
    }
    
    .sub-items {
      padding-left: 20px;
      display: none;
    }
    
    .sub-items.show {
      display: block;
    }
    
    /* Details Panel */
    .details-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
      transition: right 0.3s ease;
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }
    
    .details-panel.show {
      right: 0;
    }
    
    .details-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    
    .details-header h2 {
      margin: 0;
      color: var(--secondary-color);
    }
    
    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #999;
    }
    
    .details-content {
      line-height: 1.6;
    }
    
    .details-content p {
      margin-bottom: 15px;
    }
    
    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
    }
    
    .overlay.show {
      display: block;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .matrix-category {
        min-width: 100%;
      }
      
      .details-panel {
        width: 90%;
        right: -90%;
      }
    }
  </style>
</head>
<body>

    // Function to generate the matrix
    function generateMatrix(data, parentElement) {
      for (const category in data) {
        if (category === "description") continue;
        
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'matrix-category';
        
        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `
          <span>${category}</span>
          <span class="toggle">+</span>
        `;
        
        const content = document.createElement('div');
        content.className = 'category-content';
        
        // Add category description if available
        if (data[category].description) {
          const desc = document.createElement('p');
          desc.textContent = data[category].description;
          desc.style.fontStyle = 'italic';
          desc.style.marginBottom = '15px';
          content.appendChild(desc);
        }
        
        // Generate items
        if (data[category].items) {
          generateItems(data[category].items, content);
        }
        
        categoryDiv.appendChild(header);
        categoryDiv.appendChild(content);
        parentElement.appendChild(categoryDiv);
        
        // Toggle category
        header.addEventListener('click', function() {
          content.classList.toggle('show');
          const toggle = this.querySelector('.toggle');
          toggle.textContent = content.classList.contains('show') ? '-' : '+';
        });
      }
    }
    
    // Function to generate items
    function generateItems(items, parentElement, level = 0) {
      const ul = document.createElement('ul');
      ul.style.paddingLeft = level > 0 ? '20px' : '0';
      
      for (const item in items) {
        if (item === "description") continue;
        
        const li = document.createElement('li');
        li.className = 'matrix-item';
        
        if (typeof items[item] === 'object' && items[item] !== null) {
          li.classList.add('has-children');
          li.textContent = item;
          
          const subItems = document.createElement('div');
          subItems.className = 'sub-items';
          
          // Add description if available
          if (items[item].description) {
            const desc = document.createElement('p');
            desc.textContent = items[item].description;
            desc.style.fontSize = '0.9em';
            desc.style.color = '#666';
            desc.style.margin = '5px 0 10px';
            subItems.appendChild(desc);
          }
          
          generateItems(items[item].items, subItems, level + 1);
          li.appendChild(subItems);
          
          li.addEventListener('click', function(e) {
            e.stopPropagation();
            this.classList.toggle('expanded');
            subItems.classList.toggle('show');
          });
        } else {
          li.textContent = item;
        }
        
        // Add click handler for details
        li.addEventListener('click', function(e) {
          if (e.target === this) {
            showDetails(item, typeof items[item] === 'string' ? items[item] : items[item].description || 'No description available');
          }
        });
        
        ul.appendChild(li);
      }
      
      parentElement.appendChild(ul);
    }
    
    // Function to show details
    function showDetails(title, content) {
      document.getElementById('detailTitle').textContent = title;
      document.getElementById('detailContent').innerHTML = `<p>${content}</p>`;
      document.getElementById('overlay').classList.add('show');
      document.getElementById('detailsPanel').classList.add('show');
    }
    
    // Function to close details
    function closeDetails() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('detailsPanel').classList.remove('show');
    }
    
    // Initialize the matrix
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('defenseMatrix');
      generateMatrix(defenseMatrix, container);
      
      // Close details panel
      document.getElementById('closeDetails').addEventListener('click', closeDetails);
      document.getElementById('overlay').addEventListener('click', closeDetails);
    });
  </script>

</html>
