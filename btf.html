This requires the user to be in the libvirt group to perform privileged file write. If the target directory doesn’t exist, pool-create-as must be run with the --build option. The destination file ownership and permissions can be set in the XML.

TF=$(mktemp)
cat > $TF <<EOF
<volume type='file'>
  <name>y</name>
  <key>$LFILE_DIR/$LFILE_NAME</key>
  <source>
  </source>
  <capacity unit='bytes'>5</capacity>
  <allocation unit='bytes'>4096</allocation>
  <physical unit='bytes'>5</physical>
  <target>
    <path>$LFILE_DIR/$LFILE_NAME</path>
    <format type='raw'/>
    <permissions>
      <mode>0600</mode>
      <owner>0</owner>
      <group>0</group>
    </permissions>
  </target>
</volume>
EOF

virsh -c qemu:///system pool-create-as x dir --target $LFILE_DIR
virsh -c qemu:///system vol-create --pool x --file $TF
virsh -c qemu:///system vol-upload --pool x $LFILE_DIR/$LFILE_NAME data_to_write
virsh -c qemu:///system pool-destroy x

  const listEl = document.getElementById('binary-list');
  const titleEl = document.getElementById('binary-title');
  const detailsEl = document.getElementById('binary-details');

  // Populate sidebar list
  Object.keys(binaries).forEach((binaryName, i) => {
    const li = document.createElement('li');
    li.textContent = binaryName;
    li.tabIndex = 0; // make it keyboard focusable

    li.addEventListener('click', () => {
      selectBinary(binaryName);
    });
    li.addEventListener('keypress', e => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectBinary(binaryName);
      }
    });

    listEl.appendChild(li);
  });

  // Keep track of active item for styling
  let activeItem = null;

  function selectBinary(name) {
    // Highlight active
    if(activeItem) activeItem.classList.remove('active');
    const clickedItem = Array.from(listEl.children).find(li => li.textContent === name);
    if(clickedItem) {
      clickedItem.classList.add('active');
      activeItem = clickedItem;
    }

    titleEl.textContent = name;
    detailsEl.innerHTML = '';

    const binary = binaries[name];
    if(!binary) {
      detailsEl.textContent = 'Details not found.';
      return;
    }

    // Show capabilities badges
    const capsDiv = document.createElement('div');
    capsDiv.style.marginBottom = '1rem';
    binary.capabilities.forEach(cap => {
      const badge = document.createElement('span');
      badge.textContent = cap;
      badge.style.background = '#e63946';
      badge.style.color = 'white';
      badge.style.padding = '3px 8px';
      badge.style.marginRight = '8px';
      badge.style.borderRadius = '12px';
      badge.style.fontSize = '0.85rem';
      badge.style.userSelect = 'none';
      capsDiv.appendChild(badge);
    });
    detailsEl.appendChild(capsDiv);

    // Show description with pre formatting to preserve commands formatting
    const pre = document.createElement('pre');
    pre.textContent = binary.description.trim();
    detailsEl.appendChild(pre);
  }
